[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tl-dw"
version = "0.2.0"
description = "Local meeting transcription and multimodal video analysis preparation"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "faster-whisper>=1.2.1",
    "pillow>=11.0",
    "rapidocr-onnxruntime>=1.4.4",
]

[project.optional-dependencies]
cuda = [
    "nvidia-cublas-cu12; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "nvidia-cudnn-cu12==9.*; sys_platform == 'linux' and platform_machine == 'x86_64'",
]
sat = [
    "torch>=2.6",
    "wtpsplit>=2.0.8",
]
dev = [
    "pytest>=8.0",
]

[project.scripts]
tl-dw = "tl_dw.local_video_to_doc.cli:main"
