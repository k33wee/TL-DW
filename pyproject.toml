[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "tl-dw"
version = "0.2.0"
description = "Local meeting transcription and multimodal video analysis preparation"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "faster-whisper>=1.2.1",
    "firecrawl-anydoc==0.2.4",
    "pillow>=11.0",
    "rapidocr-onnxruntime>=1.4.4",
]

[project.optional-dependencies]
cuda = [
    "nvidia-cublas-cu12; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "nvidia-cudnn-cu12==9.*; sys_platform == 'linux' and platform_machine == 'x86_64'",
]
sat = [
    "torch>=2.6",
    "wtpsplit>=2.0.8",
]
dev = [
    "pytest>=8.0",
    "ruff==0.17.2",
]

[project.scripts]
tl-dw = "tl_dw.local_video_to_doc.cli:main"

[tool.hatch.build.targets.sdist]
only-include = ["tl_dw", "tests", "scripts", "main.py", "pyproject.toml", ".python-version", "uv.lock", "README.md", ".pi/extensions", ".pi/skills", "package.json", "package-lock.json", "tsconfig.json", ".gitignore"]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
